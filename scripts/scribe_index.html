<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>scribe</title>
<style>
  :root {
    --bg: #1a1a1a;
    --text: #e8e6e0;
    --text-dim: #6b6b6b;
    --accent: #8a8a8a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    height: 100%;
    overflow: hidden;
  }
  body {
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }

  #status {
    position: fixed;
    top: 14px;
    right: 18px;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
    user-select: none;
    z-index: 10;
    transition: opacity 0.4s;
  }

  #editor-wrap {
    height: 100%;
    overflow-y: auto;
    padding: 64px 0 70vh 0;
    display: flex;
    justify-content: center;
    scroll-behavior: smooth;
  }

  #editor {
    width: 100%;
    max-width: 720px;
    min-height: 40vh;
    padding: 0 28px;
    font-size: 18px;
    line-height: 1.9;
    color: var(--text);
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    white-space: pre-wrap;
    word-break: break-word;
    caret-color: var(--text);
  }

  #editor:empty::before {
    content: attr(data-placeholder);
    color: var(--text-dim);
  }

  /* ドラッグ中の見た目 */
  body.dragover #editor-wrap {
    background: rgba(255,255,255,0.02);
  }

  /* 画像 */
  .embed-image {
    display: block;
    max-width: 100%;
    border-radius: 6px;
    margin: 14px 0;
  }

  /* PDF */
  .embed-pdf {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    margin: 10px 0;
    background: rgba(255,255,255,0.04);
    border-radius: 8px;
    color: var(--text);
    text-decoration: none;
    width: fit-content;
    font-size: 14px;
  }

  /* ポッドキャスト埋め込みカード */
  .embed-podcast {
    display: block;
    margin: 14px 0;
    border-radius: 10px;
    overflow: hidden;
    background: rgba(255,255,255,0.03);
  }
  .embed-podcast iframe {
    display: block;
    border: none;
    width: 100%;
  }
  .embed-fallback {
    padding: 12px 16px;
    color: var(--accent);
    font-size: 14px;
    text-decoration: underline;
    word-break: break-all;
  }

  /* ポッドキャストカードにならなかった一般URL */
  a.plain-link {
    color: #7fb0e0;
    text-decoration: underline;
    word-break: break-all;
  }
</style>
</head>
<body>

<div id="status">●</div>
<div id="editor-wrap">
  <div id="editor" contenteditable="true" data-placeholder="ここに書く"></div>
</div>

<script>
const editor = document.getElementById('editor');
const statusEl = document.getElementById('status');
editor.focus();

let saveTimer = null;
const SAVE_DELAY = 1500;

function showStatus(text, color) {
  statusEl.textContent = text;
  statusEl.style.color = color || 'var(--text-dim)';
  statusEl.style.opacity = '1';
  clearTimeout(statusEl._hideTimer);
  statusEl._hideTimer = setTimeout(() => { statusEl.style.opacity = '0.3'; }, 1500);
}

function scheduleSave() {
  showStatus('・・・');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, SAVE_DELAY);
}

async function doSave() {
  try {
    const res = await fetch('/api/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ html: editor.innerHTML })
    });
    if (res.ok) {
      showStatus('保存済み');
    } else {
      showStatus('保存失敗', '#d96b6b');
    }
  } catch (e) {
    showStatus('オフライン', '#d96b6b');
  }
}

editor.addEventListener('input', scheduleSave);

// ページを閉じる/離れる前に即時保存
window.addEventListener('beforeunload', () => {
  if (saveTimer) {
    clearTimeout(saveTimer);
    navigator.sendBeacon && navigator.sendBeacon('/api/save', JSON.stringify({ html: editor.innerHTML }));
  }
});

// 起動時に今日の分を読み込む
async function loadToday() {
  try {
    const res = await fetch('/api/load');
    const data = await res.json();
    if (data.html) {
      editor.innerHTML = data.html;
      reEmbedExistingUrls();
    }
  } catch (e) {
    // 読み込み失敗時はまっさらのまま
  }
  placeCaretAtEnd();
}

// サーバーから読み込んだHTML中に、まだカード化/リンク化されていない生のURLが
// テキストとして残っている場合、それらを検出してカードまたはリンクに置き換える。
// (保存時にiframeを「元のURL」に戻しているため、再読み込み時にはテキストの状態で戻ってくる)
function reEmbedExistingUrls() {
  // editor内の全テキストノードを走査し、URL単体の行を見つけてカード化/リンク化する
  const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT, null);
  const targets = [];
  let node;
  while ((node = walker.nextNode())) {
    const trimmed = node.textContent.trim();
    if (/^https?:\/\/\S+$/.test(trimmed)) {
      const card = tryEmbedUrl(trimmed);
      targets.push({ node, replacement: card || makeLinkNode(trimmed) });
    }
  }
  targets.forEach(({ node, replacement }) => {
    node.parentNode.replaceChild(replacement, node);
  });
}

function placeCaretAtEnd() {
  editor.focus();
  const range = document.createRange();
  range.selectNodeContents(editor);
  range.collapse(false);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

// ---- ポッドキャストURLの自動カード化 ----
const PODCAST_PATTERNS = [
  { re: /https?:\/\/open\.spotify\.com\/(?:intl-[a-z]+\/)?episode\/([a-zA-Z0-9]+)/, embed: (m) => `https://open.spotify.com/embed/episode/${m[1]}`, height: 152 },
  { re: /https?:\/\/open\.spotify\.com\/(?:intl-[a-z]+\/)?show\/([a-zA-Z0-9]+)/, embed: (m) => `https://open.spotify.com/embed/show/${m[1]}`, height: 152 },
  { re: /https?:\/\/podcasts\.apple\.com\/[^\s]+/, embed: (m) => m[0].replace('podcasts.apple.com', 'embed.podcasts.apple.com'), height: 175 },
  { re: /https?:\/\/(www\.)?youtube\.com\/watch\?v=([a-zA-Z0-9_-]+)/, embed: (m) => `https://www.youtube.com/embed/${m[2]}`, height: 200 },
  { re: /https?:\/\/youtu\.be\/([a-zA-Z0-9_-]+)/, embed: (m) => `https://www.youtube.com/embed/${m[1]}`, height: 200 },
];

function tryEmbedUrl(url) {
  for (const p of PODCAST_PATTERNS) {
    const m = url.match(p.re);
    if (m) {
      const wrap = document.createElement('div');
      wrap.className = 'embed-podcast';
      wrap.contentEditable = 'false';
      const iframe = document.createElement('iframe');
      iframe.src = p.embed(m);
      iframe.height = p.height;
      iframe.setAttribute('allow', 'autoplay; encrypted-media; fullscreen; picture-in-picture');
      iframe.setAttribute('loading', 'lazy');
      wrap.appendChild(iframe);
      return wrap;
    }
  }
  return null;
}

// テキストが貼られた直後に、直前の行がURLっぽければカード化、または通常のリンク化を試みる
editor.addEventListener('paste', (e) => {
  const text = (e.clipboardData || window.clipboardData).getData('text');
  if (!text) return;
  const trimmed = text.trim();
  const isUrl = /^https?:\/\/\S+$/.test(trimmed);
  if (!isUrl) return; // URL単体の貼り付け以外は通常のペースト処理に任せる

  e.preventDefault();

  const card = tryEmbedUrl(trimmed);
  if (card) {
    insertNodeAtCaret(card);
  } else {
    // ポッドキャストの形式に一致しない一般のURLは、クリック可能なリンクとして挿入する
    insertNodeAtCaret(makeLinkNode(trimmed));
  }
  insertNodeAtCaret(document.createElement('br'));
  scheduleSave();
});

function makeLinkNode(url) {
  const a = document.createElement('a');
  a.href = url;
  a.textContent = url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.className = 'plain-link';
  return a;
}

function insertNodeAtCaret(node) {
  const sel = window.getSelection();
  if (!sel.rangeCount) { editor.appendChild(node); return; }
  const range = sel.getRangeAt(0);
  range.deleteContents();
  range.insertNode(node);
  range.setStartAfter(node);
  range.collapse(true);
  sel.removeAllRanges();
  sel.addRange(range);
}

// ---- 画像・PDFのドラッグ&ドロップ ----
['dragover', 'dragenter'].forEach(evt =>
  document.body.addEventListener(evt, (e) => { e.preventDefault(); document.body.classList.add('dragover'); })
);
['dragleave', 'drop'].forEach(evt =>
  document.body.addEventListener(evt, (e) => { document.body.classList.remove('dragover'); })
);

document.body.addEventListener('drop', async (e) => {
  e.preventDefault();
  const files = e.dataTransfer.files;
  if (!files || files.length === 0) return;

  for (const file of files) {
    await handleFile(file);
  }
  scheduleSave();
});

async function handleFile(file) {
  const formData = new FormData();
  formData.append('file', file);
  showStatus('アップロード中...');
  try {
    const res = await fetch('/api/upload', { method: 'POST', body: formData });
    const data = await res.json();
    if (!data.url) { showStatus('失敗', '#d96b6b'); return; }

    let node;
    if (file.type.startsWith('image/')) {
      node = document.createElement('img');
      node.className = 'embed-image';
      node.src = data.url;
    } else if (file.type === 'application/pdf') {
      node = document.createElement('a');
      node.className = 'embed-pdf';
      node.href = data.url;
      node.target = '_blank';
      node.textContent = '📄 ' + file.name;
    } else {
      return;
    }
    node.contentEditable = 'false';
    placeCaretAtEnd();
    insertNodeAtCaret(node);
    insertNodeAtCaret(document.createElement('br'));
    showStatus('保存済み');
  } catch (e) {
    showStatus('失敗', '#d96b6b');
  }
}

loadToday();
</script>
</body>
</html>
